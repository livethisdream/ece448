<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Predict where the envelope reaches zero</title>
<style>
  :root { --navy:#004a85; --mid:#0067b9; --edge:#cddce9; --edge2:#b9d2e5; --bg:#f5f9fc;
          --ink:#15202b; --ink3:#5b6573; --amber:#8a5a00; --red:#b01e24; }
  html,body { margin:0; padding:0; font-family:'Inter',system-ui,-apple-system,sans-serif; color:var(--ink); background:#fff; }
  .app { display:flex; flex-direction:column; gap:8px; padding:12px; }
  canvas { display:block; box-sizing:border-box; width:100%; height:auto; background:#fff; border:1px solid var(--edge); border-radius:6px; }
  canvas:focus-visible { outline:2px solid var(--navy); outline-offset:2px; }
  .controls { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px 16px; align-items:end;
              padding:8px 12px; background:var(--bg); border:1px solid var(--edge); border-radius:6px; }
  @media (max-width:560px) { .controls { grid-template-columns:1fr; } }
  .ctl { display:grid; grid-template-columns:auto 1fr; column-gap:8px; row-gap:2px; align-items:center; min-width:0; }
  .ctl label, .ctl .lab { font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink3); font-weight:700; white-space:nowrap; }
  .ctl .val { color:var(--navy); font-size:12px; font-weight:600; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; }
  .ctl input[type=range] { grid-column:1 / span 2; width:100%; margin:0; accent-color:var(--amber); }
  .ctl.pred .val { color:var(--amber); }
  /* Before a guess the slider is faint, so its resting place does not suggest an answer. */
  .ctl.pred.open input[type=range] { opacity:0.35; }
  .seg { display:flex; gap:4px; justify-content:flex-end; flex-wrap:wrap; }
  .seg button { font:inherit; font-size:11.5px; font-weight:600; color:var(--navy); background:#fff; border:1px solid var(--edge2); border-radius:14px; padding:3px 10px; cursor:pointer; }
  .seg button[aria-pressed="true"] { background:var(--navy); color:#fff; border-color:var(--navy); }
  .wide { grid-column:1 / -1; }
  .show { font:700 12px 'Inter',system-ui,sans-serif; text-transform:uppercase; letter-spacing:0.05em;
          height:30px; padding:0 14px; border-radius:5px; cursor:pointer;
          border:1px solid var(--navy); background:var(--navy); color:#fff; }
  .show[aria-pressed="true"] { background:#fff; color:var(--navy); }
  .show:disabled { cursor:not-allowed; background:#e3e8ee; border-color:#c7cfd8; color:#7a8591; }
  .seg button:focus-visible, .show:focus-visible { outline:2px solid var(--navy); outline-offset:2px; }
  .readouts { display:grid; gap:6px; grid-template-columns:repeat(3,minmax(0,1fr)); }
  .ro { display:flex; flex-direction:column; align-items:center; gap:2px; padding:5px 4px 6px; min-width:0;
        border:1px solid var(--edge2); border-radius:6px; background:#eef4fa; }
  .ro .k { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink3); white-space:nowrap; overflow:hidden; max-width:100%; }
  .ro .v { font-size:14px; font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums; color:var(--navy); }
  .ro.p .v { color:var(--amber); }
  .ro.a .v { color:var(--red); }
</style>
</head>
<body>
<div class="app">
  <canvas id="plot" tabindex="0" aria-label="Top: the message x(t) over 2 ms. Bottom: once you ask, the envelope 1 + m x(t) at the modulation index where it first reaches zero, and at your prediction."></canvas>

  <div class="controls">
    <div class="ctl wide"><span class="lab">Message</span>
      <div class="seg" id="msg" role="group" aria-label="Message">
        <button data-k="0" aria-pressed="false">1 kHz tone</button><button data-k="1" aria-pressed="true">1 + 2.5 kHz</button><button data-k="2" aria-pressed="false">1 + 2 kHz</button>
      </div>
    </div>
    <div class="ctl pred open" id="pred-ctl"><label for="pred">My prediction: m</label><span class="val" id="pred-v"></span>
      <input type="range" id="pred" min="0.5" max="2.5" step="0.01" value="1.5"></div>
    <div class="ctl" style="justify-items:end"><span class="lab"></span>
      <button class="show" id="show" aria-pressed="false" disabled>Show where it reaches zero</button></div>
  </div>

  <div class="readouts">
    <div class="ro"><span class="k">deepest trough</span><span class="v" id="r-t">?</span></div>
    <div class="ro a"><span class="k">reaches zero at</span><span class="v" id="r-a">?</span></div>
    <div class="ro p"><span class="k">my guess was</span><span class="v" id="r-o">?</span></div>
  </div>
</div>

<script>
'use strict';
// A two-tone message x(t), scaled so it peaks at +1, and the modulation index
// m at which the DSB-AM envelope 1 + m x(t) first reaches zero: m = 1/|min x|.
// The messages offered are a single tone, Lesson 6's 0.6/0.4 pair at 1 and
// 2.5 kHz, and a 0.7/0.3 pair at 1 and 2 kHz. None is the L6 Lab's message,
// so no readout equals a Part 1 answer.
//
// Prediction first: the envelope stays hidden until the cadet moves the
// prediction slider and presses Show. Any change hides it again.
const SANS = 'Inter, system-ui, -apple-system, sans-serif';
const C = { navy:'#004a85', red:'#b01e24', amber:'#8a5a00', grid:'#e6eef6', axis:'#8a929c', ink:'#15202b', ink3:'#5b6573', fill:'#eaf2fa' };
const MSGS = [
  [[1.0, 1000]],
  [[0.6, 1000], [0.4, 2500]],
  [[0.7, 1000], [0.3, 2000]],
];
const T = 2e-3;                               // the plots span 2 ms
const state = { k: 1, pred: 1.5, committed: false, shown: false };

const x = (k, t) => MSGS[k].reduce((s, [a, f]) => s + a*Math.cos(2*Math.PI*f*t), 0);
const trough = k => { let lo = 1; for (let i = 0; i <= 20000; i++){ const v = x(k, i*T/20000); if (v < lo) lo = v; } return lo; };
const TROUGH = MSGS.map((_, k) => trough(k));
const mZero = k => 1/Math.abs(TROUGH[k]);
const m = '−';
const f2 = v => v.toFixed(2);

const canvas = document.getElementById('plot'), ctx = canvas.getContext('2d');
const predEl = document.getElementById('pred'), showBtn = document.getElementById('show');

function stext(str,x0,y,px,color,align,bold){ ctx.fillStyle=color; ctx.font=(bold?'700 ':'')+px+'px '+SANS; ctx.textAlign=align||'left'; ctx.textBaseline='middle'; ctx.fillText(str,x0,y); }

function resize(){
  const w = canvas.clientWidth, dpr = window.devicePixelRatio || 1;
  const h = Math.round(Math.max(270, Math.min(w*0.46, 330)));
  canvas.style.height = h + 'px';
  canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}
window.addEventListener('resize', resize);

// One panel: y from lo to hi with gridlines every step, a trace function, and labels.
function panel(top, bot, lo, hi, step, mL, pw, fs, labelFmt){
  const yv = v => bot - (v - lo)/(hi - lo)*(bot - top);
  ctx.fillStyle = '#fbfdff'; ctx.fillRect(mL, top, pw, bot - top);
  for (let v = lo; v <= hi + 1e-9; v += step){
    const y = yv(v);
    ctx.strokeStyle = Math.abs(v) < 1e-9 ? C.axis : C.grid; ctx.lineWidth = Math.abs(v) < 1e-9 ? 1.2 : 1;
    ctx.beginPath(); ctx.moveTo(mL, y); ctx.lineTo(mL + pw, y); ctx.stroke();
    if (labelFmt) stext(labelFmt(v), mL - 4, y, fs, C.ink3, 'right');
  }
  return yv;
}

function trace(fn, yv, mL, pw, color, lw, dash){
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.setLineDash(dash || []);
  ctx.beginPath();
  const N = Math.max(200, Math.round(pw*1.5));
  for (let i = 0; i <= N; i++){ const t = i/N*T, X = mL + i/N*pw, Y = yv(fn(t)); i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }
  ctx.stroke(); ctx.setLineDash([]);
}

function draw(){
  const dpr = window.devicePixelRatio || 1, w = canvas.width/dpr, h = canvas.height/dpr;
  ctx.clearRect(0,0,w,h);
  const narrow = w < 470, fs = narrow ? 10 : 11, lab = narrow ? 11 : 12.5;
  const mL = 38, mR = 10, pw = w - mL - mR;
  const lbl = v => (v < 0 ? m + Math.abs(v).toFixed(2) : v.toFixed(2)).replace(/\.?0+$/, '') || '0';

  // ---- top: the message ----
  const tTop = 24, tBot = tTop + Math.round(h*0.30);
  stext('Message x(t)', mL, 11, lab, C.ink, 'left', true);
  stext('2 ms', w - mR, 11, fs, C.ink3, 'right');
  const yx = panel(tTop, tBot, -1, 1, 0.25, mL, pw, fs, v => (Math.abs(v*4 - Math.round(v*4)) < 1e-6 && Math.round(v*4) % 2 === 0) ? lbl(v) : '');
  trace(t => x(state.k, t), yx, mL, pw, C.navy, 2);

  // ---- bottom: the envelope, once shown ----
  const sTop = tBot + 40, sBot = h - 12;
  stext('Envelope 1 + m x(t)', mL, sTop - 14, lab, C.ink, 'left', true);
  const ye = panel(sTop, sBot, -1, 3.5, 1, mL, pw, fs, v => lbl(v));
  const mz = mZero(state.k);
  if (state.shown){
    ctx.fillStyle = 'rgba(176,30,36,0.08)';
    ctx.fillRect(mL, ye(0), pw, sBot - ye(0));
    trace(t => 1 + state.pred*x(state.k, t), ye, mL, pw, C.amber, 2, [5,4]);
    trace(t => 1 + mz*x(state.k, t), ye, mL, pw, C.red, 2.4);
    stext('red: m = ' + f2(mz) + ', just touching 0', mL + pw - 4, sTop + 10, fs, C.red, 'right', true);
    stext('dashed: your m = ' + f2(state.pred), mL + pw - 4, sTop + 24, fs, C.amber, 'right', true);
  } else {
    const msg = state.committed ? 'Press Show to draw the envelope' : 'Set your prediction for m first';
    const mpx = narrow ? 12 : 13.5;
    ctx.font = '700 ' + mpx + 'px ' + SANS;
    const mw = Math.min(ctx.measureText(msg).width + 20, pw - 8), my = (sTop + sBot)/2;
    ctx.fillStyle = 'rgba(255,255,255,0.94)'; ctx.strokeStyle = '#b9d2e5'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(mL + pw/2 - mw/2, my - mpx, mw, 2*mpx, 5); ctx.fill(); ctx.stroke();
    stext(msg, mL + pw/2, my, mpx, C.navy, 'center', true);
  }
}

function sync(){
  predEl.value = state.pred;
  document.getElementById('pred-v').textContent = state.committed ? f2(state.pred) : '?';
  document.querySelectorAll('#msg button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.k === state.k ? 'true' : 'false'));
  showBtn.disabled = !state.committed;
  showBtn.setAttribute('aria-pressed', state.shown ? 'true' : 'false');
  showBtn.textContent = state.shown ? 'Hide it' : 'Show where it reaches zero';
  document.getElementById('pred-ctl').classList.toggle('open', !state.committed);
  const mz = mZero(state.k), off = Math.abs(state.pred - mz);
  document.getElementById('r-t').textContent = state.shown ? m + Math.abs(TROUGH[state.k]).toFixed(2) : '?';
  document.getElementById('r-a').textContent = state.shown ? 'm = ' + f2(mz) : '?';
  document.getElementById('r-o').textContent = !state.shown ? '?' : (off < 0.005 ? 'right on' : 'off by ' + f2(off));
  draw();
}

// Any change hides the answer. A new message also clears the prediction.
document.querySelectorAll('#msg button').forEach(b => b.addEventListener('click', () => {
  state.k = +b.dataset.k; state.committed = false; state.shown = false; state.pred = 1.5; sync();
}));
predEl.addEventListener('input', () => { state.pred = +predEl.value; state.committed = true; state.shown = false; sync(); });
showBtn.addEventListener('click', () => { if (state.committed){ state.shown = !state.shown; sync(); } });
canvas.addEventListener('keydown', e => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  e.preventDefault();
  const d = e.key === 'ArrowLeft' ? -0.01 : 0.01;
  state.pred = Math.max(0.5, Math.min(2.5, Math.round(((state.committed ? state.pred : 1.5) + d)*100)/100));
  state.committed = true; state.shown = false; sync();
});

resize(); sync();
</script>
</body>
</html>
