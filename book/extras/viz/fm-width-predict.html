<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Predict how wide the FM signal is</title>
<style>
  :root { --navy:#004a85; --mid:#0067b9; --edge:#cddce9; --edge2:#b9d2e5; --bg:#f5f9fc;
          --ink:#15202b; --ink3:#5b6573; --amber:#8a5a00; --red:#b01e24; }
  html,body { margin:0; padding:0; font-family:'Inter',system-ui,-apple-system,sans-serif; color:var(--ink); background:#fff; }
  .app { display:flex; flex-direction:column; gap:8px; padding:12px; }
  canvas { display:block; box-sizing:border-box; width:100%; height:auto; background:#fff; border:1px solid var(--edge); border-radius:6px; cursor:crosshair; }
  canvas:focus-visible { outline:2px solid var(--navy); outline-offset:2px; }
  .controls { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px 16px; align-items:end;
              padding:8px 12px; background:var(--bg); border:1px solid var(--edge); border-radius:6px; }
  @media (max-width:560px) { .controls { grid-template-columns:1fr; } }
  .ctl { display:grid; grid-template-columns:auto 1fr; column-gap:8px; row-gap:2px; align-items:center; min-width:0; }
  .ctl label, .ctl .lab { font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink3); font-weight:700; white-space:nowrap; }
  .ctl .val { color:var(--amber); font-size:12px; font-weight:600; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; }
  .ctl input[type=range] { grid-column:1 / span 2; width:100%; margin:0; accent-color:var(--amber); }
  /* Before a guess the slider is faint, so its resting place does not suggest an answer. */
  .ctl.pred.open input[type=range] { opacity:0.35; }
  .seg { display:flex; gap:4px; justify-content:flex-end; flex-wrap:wrap; }
  .seg button { font:inherit; font-size:11.5px; font-weight:600; color:var(--navy); background:#fff; border:1px solid var(--edge2); border-radius:14px; padding:3px 10px; cursor:pointer; }
  .seg button[aria-pressed="true"] { background:var(--navy); color:#fff; border-color:var(--navy); }
  .show { font:700 12px 'Inter',system-ui,sans-serif; text-transform:uppercase; letter-spacing:0.05em;
          height:30px; padding:0 14px; border-radius:5px; cursor:pointer;
          border:1px solid var(--navy); background:var(--navy); color:#fff; }
  .show[aria-pressed="true"] { background:#fff; color:var(--navy); }
  .show:disabled { cursor:not-allowed; background:#e3e8ee; border-color:#c7cfd8; color:#7a8591; }
  .seg button:focus-visible, .show:focus-visible { outline:2px solid var(--navy); outline-offset:2px; }
  .readouts { display:grid; gap:6px; grid-template-columns:repeat(3,minmax(0,1fr)); }
  .ro { display:flex; flex-direction:column; align-items:center; gap:2px; padding:5px 4px 6px; min-width:0;
        border:1px solid var(--edge2); border-radius:6px; background:#eef4fa; }
  .ro .k { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink3); white-space:nowrap; overflow:hidden; max-width:100%; }
  .ro .v { font-size:14px; font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums; color:var(--navy); }
  .ro.p .v { color:var(--amber); }
  .ro.a .v { color:var(--red); }
</style>
</head>
<body>
<div class="app">
  <canvas id="plot" tabindex="0" aria-label="A frequency sink around the carrier, where you mark the width you predict for the FM signal and, once you ask, its spectral lines and Carson's band appear."></canvas>

  <div class="controls">
    <div class="ctl"><span class="lab">Deviation</span>
      <div class="seg" id="dev" role="group" aria-label="Peak deviation">
        <button data-v="10" aria-pressed="false">10 kHz</button><button data-v="20" aria-pressed="true">20 kHz</button><button data-v="40" aria-pressed="false">40 kHz</button>
      </div>
    </div>
    <div class="ctl"><span class="lab">Tone</span>
      <div class="seg" id="tone" role="group" aria-label="Message tone">
        <button data-v="2" aria-pressed="true">2 kHz</button><button data-v="3" aria-pressed="false">3 kHz</button>
      </div>
    </div>
    <div class="ctl pred open" id="pred-ctl"><label for="pred">My prediction: width</label><span class="val" id="pred-v"></span>
      <input type="range" id="pred" min="2" max="120" step="2" value="60"></div>
    <div class="ctl" style="justify-items:end"><span class="lab"></span>
      <button class="show" id="show" aria-pressed="false" disabled>Show the spectrum</button></div>
  </div>

  <div class="readouts">
    <div class="ro"><span class="k">Carson width</span><span class="v" id="r-c">?</span></div>
    <div class="ro a"><span class="k">power inside mine</span><span class="v" id="r-a">?</span></div>
    <div class="ro p"><span class="k">my guess was</span><span class="v" id="r-o">?</span></div>
  </div>
</div>

<script>
'use strict';
// A carrier frequency modulated by one tone: lines at f_c + n f_m, each with
// the power J_n(beta)^2, beta = deviation / tone. Carson's rule puts the width
// at 2(deviation + tone). Every frequency is in kHz, relative to the carrier.
// The deviations and tones offered (10, 20, 40 kHz; 2, 3 kHz) are not the
// L7 Lab's (5 and 50 kHz with a 1 kHz tone), so no readout equals a Part 1 answer.
//
// Prediction first: the lines stay hidden until the cadet moves the
// prediction slider (or clicks the sink) and presses Show. Any change to the
// deviation, the tone, or the prediction hides them again.
const SANS = 'Inter, system-ui, -apple-system, sans-serif';
const C = { navy:'#004a85', red:'#b01e24', amber:'#8a5a00', grid:'#e6eef6', axis:'#8a929c', ink:'#15202b', ink3:'#5b6573', band:'rgba(176,30,36,0.08)' };
const HALF = 60, FLOOR = -50;                  // the sink spans -60 to +60 kHz, down to -50 dB
const state = { dev: 20, tone: 2, pred: 60, committed: false, shown: false };

// J_n(x) = (1/2pi) * integral over one period of cos(n t - x sin t); the
// trapezoid rule on a periodic integrand converges once M exceeds x + n.
function besselJ(n, x){
  const M = 2*Math.ceil(x + Math.abs(n)) + 64; let s = 0;
  for (let k = 0; k < M; k++){ const t = 2*Math.PI*k/M; s += Math.cos(n*t - x*Math.sin(t)); }
  return s/M;
}
function lines(){
  const beta = state.dev/state.tone, N = Math.floor(HALF/state.tone), out = [];
  for (let n = -N; n <= N; n++){ const j = besselJ(Math.abs(n), beta); out.push([n*state.tone, j*j]); }
  return out;                                  // [frequency, power]; the powers sum to 1
}
const carson = () => 2*(state.dev + state.tone);

const canvas = document.getElementById('plot'), ctx = canvas.getContext('2d');
const predEl = document.getElementById('pred'), showBtn = document.getElementById('show');
const m = '−';

function stext(str,x,y,px,color,align,bold){ ctx.fillStyle=color; ctx.font=(bold?'700 ':'')+px+'px '+SANS; ctx.textAlign=align||'left'; ctx.textBaseline='middle'; ctx.fillText(str,x,y); }

let geo = null;
function resize(){
  const w = canvas.clientWidth, dpr = window.devicePixelRatio || 1;
  const h = Math.round(Math.max(230, Math.min(w*0.40, 290)));
  canvas.style.height = h + 'px';
  canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}
window.addEventListener('resize', resize);

function draw(){
  const dpr = window.devicePixelRatio || 1, w = canvas.width/dpr, h = canvas.height/dpr;
  ctx.clearRect(0,0,w,h);
  const narrow = w < 470, fs = narrow ? 10 : 11, lab = narrow ? 11 : 12.5;
  const mL = 34, mR = 12, pw = w - mL - mR, top = 26, bot = h - 28;
  const xf = f => mL + (f + HALF)/(2*HALF)*pw;
  const yd = d => top + (0 - d)/(0 - FLOOR)*(bot - top);
  geo = { mL, pw, top, bot };

  stext('Frequency sink, around the carrier (kHz)', mL, 12, lab, C.ink, 'left', true);
  stext('click to mark your width', w - mR, 12, fs, C.ink3, 'right');
  ctx.fillStyle = '#fbfdff'; ctx.fillRect(mL, top, pw, bot - top);
  ctx.strokeStyle = C.grid; ctx.lineWidth = 1;
  for (let d = 0; d >= FLOOR; d -= 10){ ctx.beginPath(); ctx.moveTo(mL, yd(d)); ctx.lineTo(mL + pw, yd(d)); ctx.stroke();
    stext(d === 0 ? '0 dB' : m + (-d), mL - 4, yd(d), fs, C.ink3, 'right'); }
  const step = narrow ? 30 : 20;
  for (let f = -HALF; f <= HALF; f += step){
    ctx.strokeStyle = C.grid; ctx.beginPath(); ctx.moveTo(xf(f), top); ctx.lineTo(xf(f), bot); ctx.stroke();
    stext(f === 0 ? '0' : (f < 0 ? m + (-f) : '+' + f), xf(f), bot + 12, fs, C.ink3, 'center');
  }
  ctx.strokeStyle = C.axis; ctx.lineWidth = 1.1;
  ctx.beginPath(); ctx.moveTo(mL, bot); ctx.lineTo(mL + pw, bot); ctx.stroke();

  if (state.shown){
    const c = carson()/2;
    ctx.fillStyle = C.band; ctx.fillRect(xf(-c), top, xf(c) - xf(-c), bot - top);
    ctx.strokeStyle = C.red; ctx.lineWidth = 1.4; ctx.setLineDash([3,3]);
    [-c, c].forEach(f => { ctx.beginPath(); ctx.moveTo(xf(f), top); ctx.lineTo(xf(f), bot); ctx.stroke(); });
    ctx.setLineDash([]);
    stext('Carson', xf(c) + 3, top + 9, fs, C.red, xf(c) > mL + pw - 50 ? 'right' : 'left', true);
    ctx.strokeStyle = C.navy; ctx.lineWidth = narrow ? 1.6 : 2;
    lines().forEach(([f, p]) => {
      const d = 10*Math.log10(Math.max(p, 1e-12));
      if (d <= FLOOR) return;
      ctx.beginPath(); ctx.moveTo(xf(f), bot); ctx.lineTo(xf(f), yd(d)); ctx.stroke();
    });
  }
  if (state.committed){
    const p = state.pred/2;
    ctx.strokeStyle = C.amber; ctx.lineWidth = 2; ctx.setLineDash([5,4]);
    [-p, p].forEach(f => { if (Math.abs(f) <= HALF){ ctx.beginPath(); ctx.moveTo(xf(f), bot); ctx.lineTo(xf(f), top + 18); ctx.stroke(); } });
    ctx.setLineDash([]);
    stext('my width', xf(-p), top + 10, fs, C.amber, xf(-p) < mL + 40 ? 'left' : 'center', true);
  }
  if (!state.shown && !state.committed){
    const msg = 'Mark how wide the signal will be', mpx = narrow ? 12 : 13.5;
    ctx.font = '700 ' + mpx + 'px ' + SANS;
    const mw = Math.min(ctx.measureText(msg).width + 20, pw - 8), my = (top + bot)/2;
    ctx.fillStyle = 'rgba(255,255,255,0.94)'; ctx.strokeStyle = '#b9d2e5'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(mL + pw/2 - mw/2, my - mpx, mw, 2*mpx, 5); ctx.fill(); ctx.stroke();
    stext(msg, mL + pw/2, my, mpx, C.navy, 'center', true);
  }
}

function sync(){
  predEl.value = state.pred;
  document.getElementById('pred-v').textContent = state.committed ? state.pred + ' kHz' : '?';
  document.querySelectorAll('#dev button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.v === state.dev ? 'true' : 'false'));
  document.querySelectorAll('#tone button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.v === state.tone ? 'true' : 'false'));
  showBtn.disabled = !state.committed;
  showBtn.setAttribute('aria-pressed', state.shown ? 'true' : 'false');
  showBtn.textContent = state.shown ? 'Hide it' : 'Show the spectrum';
  document.getElementById('pred-ctl').classList.toggle('open', !state.committed);
  const inside = lines().reduce((s, [f, p]) => s + (Math.abs(f) <= state.pred/2 + 1e-9 ? p : 0), 0);
  const off = Math.abs(state.pred - carson());
  document.getElementById('r-c').textContent = state.shown ? carson() + ' kHz' : '?';
  document.getElementById('r-a').textContent = state.shown ? Math.round(100*inside) + '%' : '?';
  document.getElementById('r-o').textContent = !state.shown ? '?' : (off === 0 ? 'right on' : 'off by ' + off + ' kHz');
  draw();
}

// Any change hides the answer. A new deviation or tone also clears the prediction.
function reset(){ state.committed = false; state.shown = false; state.pred = 60; }
document.querySelectorAll('#dev button').forEach(b => b.addEventListener('click', () => { state.dev = +b.dataset.v; reset(); sync(); }));
document.querySelectorAll('#tone button').forEach(b => b.addEventListener('click', () => { state.tone = +b.dataset.v; reset(); sync(); }));
predEl.addEventListener('input', () => { state.pred = +predEl.value; state.committed = true; state.shown = false; sync(); });
showBtn.addEventListener('click', () => { if (state.committed){ state.shown = !state.shown; sync(); } });

function predictAt(clientX){
  if (!geo) return;
  const r = canvas.getBoundingClientRect(), f = Math.abs((clientX - r.left - geo.mL)/geo.pw*2*HALF - HALF);
  state.pred = Math.max(2, Math.min(120, 2*Math.round(f))); state.committed = true; state.shown = false; sync();
}
canvas.addEventListener('click', e => predictAt(e.clientX));
canvas.addEventListener('keydown', e => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  e.preventDefault();
  const d = e.key === 'ArrowLeft' ? -2 : 2;
  state.pred = Math.max(2, Math.min(120, (state.committed ? state.pred : 60) + d));
  state.committed = true; state.shown = false; sync();
});

resize(); sync();
</script>
</body>
</html>
