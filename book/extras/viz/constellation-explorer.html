<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Constellation explorer — symbols, noise, and decision regions</title>
<style>
  :root { --navy:#004a85; --mid:#0067b9; --edge:#cddce9; --edge2:#b9d2e5; --bg:#f5f9fc;
          --ink:#15202b; --ink3:#5b6573;
          --amber:#8a5a00; --red:#b01e24; --grn:#3f7d34; }
  html,body { margin:0; padding:0; font-family:'Inter',system-ui,-apple-system,sans-serif; color:var(--ink); background:#fff; }
  .app { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px; padding:12px; align-items:start; }
  @media (max-width:620px) { .app { grid-template-columns:1fr; gap:8px; padding:8px; } }
  canvas { display:block; box-sizing:border-box; width:100%; height:auto; background:#fff; border:1px solid var(--edge); border-radius:6px; }
  .side { display:flex; flex-direction:column; gap:8px; min-width:0; }
  .controls { display:flex; flex-direction:column; gap:8px; padding:9px 12px; background:var(--bg); border:1px solid var(--edge); border-radius:6px; }
  .ctl { display:grid; grid-template-columns:auto 1fr; column-gap:8px; row-gap:2px; align-items:center; min-width:0; }
  .ctl label { font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink3); font-weight:700; white-space:nowrap; }
  .ctl .val { color:var(--navy); font-size:12px; font-weight:600; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; }
  .ctl input[type=range]{ grid-column:1 / span 2; width:100%; margin:0; accent-color:var(--mid); }
  .mods { grid-column:1 / span 2; display:flex; flex-wrap:wrap; gap:4px; }
  .mods button { font:inherit; font-size:11.5px; font-weight:600; color:var(--navy); background:#fff; border:1px solid var(--edge2); border-radius:14px; padding:3px 9px; cursor:pointer; }
  .mods button.on { background:var(--navy); color:#fff; border-color:var(--navy); }
  .readouts { display:grid; gap:6px; grid-template-columns:repeat(2,minmax(0,1fr)); }
  @media (max-width:620px) { .readouts { grid-template-columns:repeat(4,minmax(0,1fr)); } }
  .ro { display:flex; flex-direction:column; align-items:center; gap:2px; padding:5px 4px 6px; min-width:0;
        border:1px solid var(--edge2); border-radius:6px; background:#eef4fa; }
  .ro .k { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink3); white-space:nowrap; }
  .ro .v { font-size:14px; font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums; color:var(--navy); }
  .ro.err .v { color:var(--red); }
  .row { display:flex; gap:6px; }
  .row button { font:inherit; font-size:11.5px; font-weight:600; color:var(--navy); background:#fff; border:1px solid var(--edge2); border-radius:14px; padding:3px 10px; cursor:pointer; }
</style>
</head>
<body>
<div class="app">
  <canvas id="iq" aria-label="Received symbols on the I-Q plane with decision regions; symbols in the wrong region in red"></canvas>
  <div class="side">
    <div class="controls">
      <div class="ctl"><label>Modulation</label><span></span>
        <div class="mods" id="mods"></div></div>
      <div class="ctl"><label for="snr">SNR</label><span class="val" id="snr-v"></span><input type="range" id="snr" min="0" max="25" step="0.5" value="12"></div>
      <div class="ctl"><label for="ph">Phase offset</label><span class="val" id="ph-v"></span><input type="range" id="ph" min="0" max="45" step="1" value="0"></div>
    </div>
    <div class="readouts">
      <div class="ro"><span class="k">symbols</span><span class="v" id="o-n">—</span></div>
      <div class="ro err"><span class="k">wrong region</span><span class="v" id="o-se">—</span></div>
      <div class="ro err"><span class="k">wrong, %</span><span class="v" id="o-pct">—</span></div>
      <div class="ro"><span class="k">bits/symbol</span><span class="v" id="o-k">—</span></div>
    </div>
    <div class="row"><button id="pause">pause</button><button id="clear">clear</button></div>
  </div>
</div>

<script>
'use strict';
const SANS = 'Inter, system-ui, -apple-system, sans-serif';
const COL = { navy:'#004a85', mid:'#0067b9', red:'#b01e24', amber:'#8a5a00', rule:'#cddce9', ink3:'#5b6573' };
const REGION = ['#e4eef7', '#f8fbfd'];          // alternating decision-region tints

// Constellations at unit average symbol energy, each point with its Gray label.
function gray(n){ return n ^ (n >> 1); }
function build(name) {
  let pts = [];
  if (name === 'BPSK') pts = [[-1,0,1],[1,0,0]];
  if (name === 'QPSK') for (let i = 0; i < 4; i++) { const a = Math.PI/4 + i*Math.PI/2; pts.push([Math.cos(a), Math.sin(a), gray(i)]); }
  if (name === '8-PSK') for (let i = 0; i < 8; i++) { const a = i*Math.PI/4; pts.push([Math.cos(a), Math.sin(a), gray(i)]); }
  if (name === '16-PSK') for (let i = 0; i < 16; i++) { const a = i*Math.PI/8; pts.push([Math.cos(a), Math.sin(a), gray(i)]); }
  if (name === '4-PAM') [-3,-1,1,3].forEach((x,i) => pts.push([x, 0, gray(i)]));
  const e = pts.reduce((s,p) => s + p[0]*p[0] + p[1]*p[1], 0) / pts.length;
  const s = 1 / Math.sqrt(e);
  return pts.map(p => ({ x: p[0]*s, y: p[1]*s, b: p[2] }));
}
const MODS = { 'BPSK':1, 'QPSK':2, '8-PSK':3, '16-PSK':4, '4-PAM':2 };

const state = { mod: 'QPSK', pts: build('QPSK'), rx: [], nSym: 0, nSymErr: 0, running: true };
const MAXPTS = 1500;
const snrEl = document.getElementById('snr'), phEl = document.getElementById('ph');
const modsEl = document.getElementById('mods');
for (const m of Object.keys(MODS)) {
  const b = document.createElement('button'); b.textContent = m; b.dataset.m = m;
  b.onclick = () => { setMod(m); }; modsEl.appendChild(b);
}
function setMod(m){ state.mod = m; state.pts = build(m); clear();
  [...modsEl.children].forEach(b => b.classList.toggle('on', b.dataset.m === m)); }
function clear(){ state.rx = []; state.nSym = state.nSymErr = 0; drawRegions(); draw(); }
snrEl.oninput = () => { labels(); clear(); };
phEl.oninput = () => { labels(); clear(); };
document.getElementById('clear').onclick = clear;
document.getElementById('pause').onclick = (e) => { state.running = !state.running; e.target.textContent = state.running ? 'pause' : 'run'; };
function labels(){
  document.getElementById('snr-v').textContent = (+snrEl.value).toFixed(1) + ' dB';
  document.getElementById('ph-v').textContent = phEl.value + '°';
}

function gauss(){ let u = 0, v = 0; while (u === 0) u = Math.random(); v = Math.random();
  return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v); }
function nearest(x, y){ let best = 0, bd = Infinity;
  state.pts.forEach((p,i) => { const d = (p.x-x)*(p.x-x) + (p.y-y)*(p.y-y); if (d < bd) { bd = d; best = i; } });
  return best; }

function step(n) {
  // Unit signal power, so the noise power is 1/SNR, half on each axis.
  const sigma = Math.sqrt(Math.pow(10, -snrEl.value/10) / 2);
  const ph = (+phEl.value) * Math.PI / 180, c = Math.cos(ph), s = Math.sin(ph);
  for (let j = 0; j < n; j++) {
    const i = Math.floor(Math.random() * state.pts.length), p = state.pts[i];
    const x = p.x*c - p.y*s + sigma*gauss(), y = p.x*s + p.y*c + sigma*gauss();
    const d = nearest(x, y), wrong = d !== i;
    state.nSym++; if (wrong) state.nSymErr++;
    state.rx.push([x, y, wrong]);
  }
  if (state.rx.length > MAXPTS) state.rx.splice(0, state.rx.length - MAXPTS);
}

const cv = document.getElementById('iq'), ctx = cv.getContext('2d');
const bg = document.createElement('canvas'), bgx = bg.getContext('2d');
let W = 300, LIM = 1.9;
function fit() {
  const dpr = window.devicePixelRatio || 1;
  W = Math.max(220, cv.clientWidth || 300);
  // A phone stacks the panel under the canvas, so the plot takes a shorter square there.
  const narrow = window.matchMedia && window.matchMedia('(max-width:620px)').matches;
  const H = narrow ? Math.min(W, 300) : W;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  cv.style.height = H + 'px';
  const bh = cv.offsetHeight - cv.clientHeight; if (bh) cv.style.height = (H + bh) + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  bg.width = cv.width; bg.height = cv.height;
  drawRegions(); draw();
}
function H(){ return cv.height / (window.devicePixelRatio || 1); }
function S(){ return Math.min(W, H()) / (2*LIM); }
function X(x){ return W/2 + x*S(); }
function Y(y){ return H()/2 - y*S(); }

function drawRegions() {
  // Shade each decision region: the cells whose nearest point is the same symbol.
  const dpr = window.devicePixelRatio || 1, w = bg.width, h = bg.height;
  if (!w || !h) return;
  const img = bgx.createImageData(w, h), step = 3;
  const tint = REGION.map(c => [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)]);
  // Alternate the tint between neighboring regions: by index around a PSK
  // circle or along the PAM line.
  const colorOf = i => tint[i % 2];
  for (let py = 0; py < h; py += step) for (let px = 0; px < w; px += step) {
    const x = (px/dpr - W/2) / S(), y = (H()/2 - py/dpr) / S();
    const t = colorOf(nearest(x, y));
    for (let yy = py; yy < Math.min(py+step, h); yy++) for (let xx = px; xx < Math.min(px+step, w); xx++) {
      const o = (yy*w + xx)*4; img.data[o] = t[0]; img.data[o+1] = t[1]; img.data[o+2] = t[2]; img.data[o+3] = 255; }
  }
  bgx.putImageData(img, 0, 0);
}

function draw() {
  const h = H();
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(bg, 0, 0);
  const dpr = window.devicePixelRatio || 1; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.strokeStyle = COL.rule; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, Y(0)); ctx.lineTo(W, Y(0)); ctx.moveTo(X(0), 0); ctx.lineTo(X(0), h); ctx.stroke();
  ctx.fillStyle = COL.ink3; ctx.font = '11px ' + SANS; ctx.textBaseline = 'top';
  ctx.textAlign = 'right'; ctx.fillText('I', W - 4, Y(0) + 3);
  ctx.textAlign = 'left'; ctx.fillText('Q', X(0) + 4, 3);
  // received symbols: right region in blue, wrong region in red on top
  for (const pass of [false, true]) {
    ctx.fillStyle = pass ? COL.red : 'rgba(0,103,185,0.45)';
    for (const r of state.rx) if (r[2] === pass) { ctx.beginPath(); ctx.arc(X(r[0]), Y(r[1]), pass ? 2.2 : 1.6, 0, 2*Math.PI); ctx.fill(); }
  }
  // the transmitted points
  for (const p of state.pts) {
    ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), 5, 0, 2*Math.PI);
    ctx.fillStyle = COL.navy; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = '#fff'; ctx.stroke();
  }
  readout();
}

function readout() {
  document.getElementById('o-n').textContent = state.nSym.toLocaleString();
  document.getElementById('o-se').textContent = state.nSymErr.toLocaleString();
  document.getElementById('o-pct').textContent = state.nSym ? (100 * state.nSymErr / state.nSym).toFixed(1) : '—';
  document.getElementById('o-k').textContent = MODS[state.mod];
}

function tick() { if (state.running) { step(40); draw(); } requestAnimationFrame(tick); }
window.addEventListener('resize', fit);
// A preset by query string: constellation-explorer.html?mod=8-PSK&snr=12
const q = new URLSearchParams(location.search);
if (q.get('snr')) snrEl.value = q.get('snr');
labels(); setMod(MODS[q.get('mod')] ? q.get('mod') : 'QPSK'); fit();
step(400); draw();
requestAnimationFrame(tick);
</script>
</body>
</html>
