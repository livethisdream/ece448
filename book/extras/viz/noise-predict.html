<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Predict where FM stops beating AM</title>
<style>
  :root { --navy:#004a85; --mid:#0067b9; --edge:#cddce9; --edge2:#b9d2e5; --bg:#f5f9fc;
          --ink:#15202b; --ink3:#5b6573; --amber:#8a5a00; --red:#b01e24; --band:#eaf2fa; }
  html,body { margin:0; padding:0; font-family:'Inter',system-ui,-apple-system,sans-serif; color:var(--ink); background:#fff; }
  .app { display:flex; flex-direction:column; gap:8px; padding:12px; }
  canvas { display:block; box-sizing:border-box; width:100%; height:auto; background:#fff; border:1px solid var(--edge); border-radius:6px; cursor:crosshair; }
  canvas:focus-visible { outline:2px solid var(--navy); outline-offset:2px; }
  .controls { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px 16px; align-items:end;
              padding:8px 12px; background:var(--bg); border:1px solid var(--edge); border-radius:6px; }
  @media (max-width:560px) { .controls { grid-template-columns:1fr; } }
  .ctl { display:grid; grid-template-columns:auto 1fr; column-gap:8px; row-gap:2px; align-items:center; min-width:0; }
  .ctl label, .ctl .lab { font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink3); font-weight:700; white-space:nowrap; }
  .ctl .val { color:var(--navy); font-size:12px; font-weight:600; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; }
  .ctl input[type=range] { grid-column:1 / span 2; width:100%; margin:0; accent-color:var(--mid); }
  .ctl.pred input[type=range] { accent-color:var(--amber); }
  .ctl.pred .val { color:var(--amber); }
  /* Before a guess the slider is faint, so its resting place does not suggest an answer. */
  .ctl.pred.open input[type=range] { opacity:0.35; }
  .seg { display:flex; gap:4px; justify-content:flex-end; flex-wrap:wrap; }
  .seg button { font:inherit; font-size:11.5px; font-weight:600; color:var(--navy); background:#fff; border:1px solid var(--edge2); border-radius:14px; padding:3px 10px; cursor:pointer; }
  .seg button[aria-pressed="true"] { background:var(--navy); color:#fff; border-color:var(--navy); }
  .show { font:700 12px 'Inter',system-ui,sans-serif; text-transform:uppercase; letter-spacing:0.05em;
          height:30px; padding:0 14px; border-radius:5px; cursor:pointer;
          border:1px solid var(--navy); background:var(--navy); color:#fff; }
  .show[aria-pressed="true"] { background:#fff; color:var(--navy); }
  .show:disabled { cursor:not-allowed; background:#e3e8ee; border-color:#c7cfd8; color:#7a8591; }
  .seg button:focus-visible, .show:focus-visible { outline:2px solid var(--navy); outline-offset:2px; }
  .readouts { display:grid; gap:6px; grid-template-columns:repeat(3,minmax(0,1fr)); }
  .ro { display:flex; flex-direction:column; align-items:center; gap:2px; padding:5px 4px 6px; min-width:0;
        border:1px solid var(--edge2); border-radius:6px; background:#eef4fa; }
  .ro .k { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink3); white-space:nowrap; overflow:hidden; max-width:100%; }
  .ro .v { font-size:14px; font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums; color:var(--navy); }
  .ro.p .v { color:var(--amber); }
  .ro.a .v { color:var(--red); }
</style>
</head>
<body>
<div class="app">
  <canvas id="plot" tabindex="0" aria-label="The AM and FM output SNR meters against the Input SNR, from 40 dB down to 0 dB; you mark where you think FM's output falls to AM's, then show the measured meters."></canvas>

  <div class="controls">
    <div class="ctl"><span class="lab">FM deviation</span>
      <div class="seg" id="dev" role="group" aria-label="FM deviation">
        <button data-v="25" aria-pressed="true">25 kHz</button><button data-v="35" aria-pressed="false">35 kHz</button>
      </div>
    </div>
    <div class="ctl pred open" id="pred-ctl"><label for="pred">My prediction</label><span class="val" id="pred-v"></span>
      <input type="range" id="pred" min="0" max="40" step="1" value="20"></div>
    <div class="ctl" style="justify-items:end; grid-column:1 / -1"><span class="lab"></span>
      <button class="show" id="show" aria-pressed="false" disabled>Show the meters</button></div>
  </div>

  <div class="readouts">
    <div class="ro"><span class="k">FM meets AM</span><span class="v" id="r-x">?</span></div>
    <div class="ro a"><span class="k">FM at 30 dB</span><span class="v" id="r-a">?</span></div>
    <div class="ro p"><span class="k">my guess</span><span class="v" id="r-o">?</span></div>
  </div>
</div>

<script>
'use strict';
// The two output SNR meters of L07-am-vs-fm.grc, read from the flowgraph
// itself (GNU Radio 3.10, run headless, 3 s per point) at 25 and 35 kHz of
// deviation: [Input SNR, AM meter, FM meter], all in dB. These are shown, not
// calculated. The L7 Lab measures where FM clicks at 5 and 50 kHz, so nothing
// here is a Part 1 or Part 2 answer.
//
// Prediction first: the meters stay hidden until the cadet marks where FM's
// output falls to AM's and presses Show. Any change hides them again.
const DATA = {25: [[0, -1.9, -6.0], [2, 0.3, -3.7], [4, 2.4, -1.4], [6, 5.0, 1.7], [8, 7.1, 5.3], [10, 9.2, 9.2], [12, 11.1, 14.9], [14, 13.4, 22.1], [16, 15.6, 31.3], [18, 17.4, 37.4], [20, 19.2, 39.3], [22, 21.5, 41.2], [24, 23.7, 43.1], [26, 25.5, 45.1], [28, 27.6, 46.9], [30, 29.6, 48.5], [32, 31.7, 50.1], [34, 33.6, 51.5], [36, 35.5, 52.8], [38, 37.7, 53.7], [40, 39.7, 54.5]], 35: [[0, -1.8, -6.6], [2, 0.3, -4.6], [4, 2.6, -2.5], [6, 4.9, 1.1], [8, 7.0, 4.0], [10, 9.1, 7.9], [12, 11.4, 12.3], [14, 13.5, 17.4], [16, 15.1, 25.7], [18, 17.6, 37.7], [20, 19.3, 41.2], [22, 21.5, 44.0], [24, 23.4, 46.0], [26, 25.5, 47.6], [28, 27.6, 49.5], [30, 29.5, 50.9], [32, 31.5, 52.3], [34, 33.4, 53.6], [36, 35.5, 54.5], [38, 37.6, 55.2], [40, 39.5, 55.8]]};
const SANS = 'Inter, system-ui, -apple-system, sans-serif';
const C = { navy:'#004a85', red:'#b01e24', amber:'#8a5a00', grid:'#e6eef6', axis:'#8a929c', ink:'#15202b', ink3:'#5b6573' };
const state = { dev: 25, pred: 20, committed: false, shown: false };

// Where the FM meter first falls to the AM meter, coming down from 40 dB.
function meet(){
  const p = DATA[state.dev];
  for (let i = p.length - 1; i > 0; i--){
    const [x1, a1, f1] = p[i], [x0, a0, f0] = p[i - 1];
    if (f1 - a1 > 0 && f0 - a0 <= 0) return x0 + (x1 - x0)*(0 - (f0 - a0))/((f1 - a1) - (f0 - a0));
  }
  return p[0][0];
}
const at30 = () => DATA[state.dev].find(r => r[0] === 30)[2];

const canvas = document.getElementById('plot'), ctx = canvas.getContext('2d');
const predEl = document.getElementById('pred'), showBtn = document.getElementById('show');
function stext(s,x,y,px,color,align,bold){ ctx.fillStyle=color; ctx.font=(bold?'700 ':'')+px+'px '+SANS; ctx.textAlign=align||'left'; ctx.textBaseline='middle'; ctx.fillText(s,x,y); }

let geo = null;
function resize(){
  const w = canvas.clientWidth, dpr = window.devicePixelRatio || 1;
  const h = Math.round(Math.max(240, Math.min(w*0.42, 300)));
  canvas.style.height = h + 'px';
  canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}
window.addEventListener('resize', resize);

function draw(){
  const dpr = window.devicePixelRatio || 1, w = canvas.width/dpr, h = canvas.height/dpr;
  ctx.clearRect(0,0,w,h);
  const narrow = w < 470, fs = narrow ? 10 : 11, lab = narrow ? 11 : 12.5;
  const mL = 34, mR = 12, top = 26, bot = h - 30, pw = w - mL - mR;
  // Input SNR runs from 40 dB on the left down to 0 dB on the right: the noise rises left to right.
  const xs = v => mL + (40 - v)/40*pw, ys = v => bot - (v + 10)/70*(bot - top);
  geo = { mL, pw, top, bot };
  stext('Output SNR (dB) as the noise rises', mL, 12, lab, C.ink, 'left', true);
  ctx.fillStyle = '#fbfdff'; ctx.fillRect(mL, top, pw, bot - top);
  for (let v = -10; v <= 60; v += 10){
    ctx.strokeStyle = v === 0 ? C.axis : C.grid; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(mL, ys(v)); ctx.lineTo(mL + pw, ys(v)); ctx.stroke();
    if (v % 20 === 0) stext(String(v).replace('-', '\u2212'), mL - 4, ys(v), fs, C.ink3, 'right');
  }
  for (let v = 40; v >= 0; v -= (narrow ? 20 : 10)){
    stext(String(v), xs(v), bot + 11, fs, C.ink3, 'center');
  }
  stext('Input SNR (dB)', mL + pw, bot + 24, fs, C.ink3, 'right');
  if (state.shown){
    const p = DATA[state.dev];
    [[1, C.navy, 'AM'], [2, C.red, 'FM']].forEach(([k, col, name]) => {
      ctx.strokeStyle = col; ctx.lineWidth = 2.2; ctx.beginPath();
      p.forEach((r, i) => { const X = xs(r[0]), Y = ys(r[k]); i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); });
      ctx.stroke();
      const last = p[p.length - 1];
      stext(name, xs(last[0]) + 4, ys(last[k]) - 8, fs, col, 'left', true);
    });
    const x = meet();
    ctx.strokeStyle = C.red; ctx.lineWidth = 1.2; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(xs(x), top); ctx.lineTo(xs(x), bot); ctx.stroke(); ctx.setLineDash([]);
  }
  if (state.committed){
    ctx.strokeStyle = C.amber; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(xs(state.pred), bot); ctx.lineTo(xs(state.pred), top + 4); ctx.stroke(); ctx.setLineDash([]);
  } else {
    const msg = 'Mark where FM falls to AM', mpx = narrow ? 12 : 13.5;
    ctx.font = '700 ' + mpx + 'px ' + SANS;
    const mw = Math.min(ctx.measureText(msg).width + 20, pw - 8), my = (top + bot)/2;
    ctx.fillStyle = 'rgba(255,255,255,0.94)'; ctx.strokeStyle = '#b9d2e5'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(mL + pw/2 - mw/2, my - mpx, mw, 2*mpx, 5); ctx.fill(); ctx.stroke();
    stext(msg, mL + pw/2, my, mpx, C.navy, 'center', true);
  }
}

function sync(){
  predEl.value = state.pred;
  document.getElementById('pred-v').textContent = state.committed ? state.pred + ' dB' : '?';
  document.querySelectorAll('#dev button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.v === state.dev ? 'true' : 'false'));
  showBtn.disabled = !state.committed;
  showBtn.setAttribute('aria-pressed', state.shown ? 'true' : 'false');
  showBtn.textContent = state.shown ? 'Hide it' : 'Show the meters';
  document.getElementById('pred-ctl').classList.toggle('open', !state.committed);
  const x = meet(), off = Math.abs(state.pred - x);
  document.getElementById('r-x').textContent = state.shown ? x.toFixed(0) + ' dB' : '?';
  document.getElementById('r-a').textContent = state.shown ? at30().toFixed(0) + ' dB' : '?';
  document.getElementById('r-o').textContent = !state.shown ? '?' : (off < 0.5 ? 'right on' : 'off ' + off.toFixed(0) + ' dB');
  draw();
}

document.querySelectorAll('#dev button').forEach(b => b.addEventListener('click', () => {
  state.dev = +b.dataset.v; state.committed = false; state.shown = false; state.pred = 20; sync();
}));
predEl.addEventListener('input', () => { state.pred = +predEl.value; state.committed = true; state.shown = false; sync(); });
showBtn.addEventListener('click', () => { if (state.committed){ state.shown = !state.shown; sync(); } });
canvas.addEventListener('click', e => {
  if (!geo) return;
  const r = canvas.getBoundingClientRect(), v = Math.round(40 - (e.clientX - r.left - geo.mL)/geo.pw*40);
  state.pred = Math.max(0, Math.min(40, v)); state.committed = true; state.shown = false; sync();
});
canvas.addEventListener('keydown', e => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  e.preventDefault();
  const d = e.key === 'ArrowLeft' ? 1 : -1;
  state.pred = Math.max(0, Math.min(40, (state.committed ? state.pred : 20) + d));
  state.committed = true; state.shown = false; sync();
});

resize(); sync();
</script>
</body>
</html>
