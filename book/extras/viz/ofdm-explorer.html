<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OFDM explorer — subcarrier spacing and the guard interval</title>
<style>
  :root { --navy:#004a85; --mid:#0067b9; --edge:#cddce9; --edge2:#b9d2e5; --bg:#f5f9fc;
          --ink:#15202b; --ink3:#5b6573;
          --amber:#8a5a00; --red:#b01e24; --grn:#3f7d34; }
  html,body { margin:0; padding:0; font-family:'Inter',system-ui,-apple-system,sans-serif; color:var(--ink); background:#fff; }
  .app { display:flex; flex-direction:column; gap:8px; padding:12px; }
  .plots { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; }
  @media (max-width:620px) { .plots { grid-template-columns:1fr; } }
  canvas { display:block; box-sizing:border-box; width:100%; height:auto; background:#fff; border:1px solid var(--edge); border-radius:6px; }
  .controls { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px 16px; align-items:center;
              padding:8px 12px; background:var(--bg); border:1px solid var(--edge); border-radius:6px; }
  @media (max-width:620px) { .controls { grid-template-columns:1fr; } }
  .ctl { display:grid; grid-template-columns:auto 1fr; column-gap:8px; row-gap:2px; align-items:center; min-width:0; }
  .ctl label { font-size:11px; letter-spacing:0.02em; color:var(--ink3); font-weight:700; white-space:nowrap; }
  .ctl .val { color:var(--navy); font-size:12px; font-weight:600; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; }
  .ctl input[type=range]{ grid-column:1 / span 2; width:100%; margin:0; accent-color:var(--mid); }
  .seg { display:flex; gap:4px; flex-wrap:wrap; grid-column:1 / -1; }
  .seg button { font:inherit; font-size:11.5px; font-weight:600; color:var(--navy); background:#fff; border:1px solid var(--edge2); border-radius:14px; padding:3px 10px; cursor:pointer; }
  .seg button.on { background:var(--navy); color:#fff; border-color:var(--navy); }
  .readouts { display:grid; gap:6px; grid-template-columns:repeat(4,minmax(0,1fr)); }
  @media (max-width:620px) { .readouts { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  .ro { display:flex; flex-direction:column; align-items:center; gap:2px; padding:5px 4px 6px; min-width:0;
        border:1px solid var(--edge2); border-radius:6px; background:#eef4fa; }
  .ro .k { font-size:10.5px; font-weight:700; letter-spacing:0.02em; color:var(--ink3); white-space:nowrap; }
  .ro .v { font-size:14px; font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums; color:var(--navy); }
  .ro .v.bad { color:var(--red); } .ro .v.ok { color:var(--grn); } .ro .v.warn { color:var(--amber); }
</style>
</head>
<body>
<div class="app">
  <div class="plots">
    <canvas id="spec" aria-label="The spectra of five neighboring OFDM subcarriers, each a sinc shape, with a dot at each subcarrier's center frequency"></canvas>
    <canvas id="time" aria-label="Two OFDM symbols with their guard intervals, an echo of them delayed in time, and the receiver's FFT window"></canvas>
  </div>
  <div class="controls">
    <div class="seg" id="preset"><button data-p="1,60" class="on">HD Radio</button><button data-p="0.9,60">spacing 10% short</button><button data-p="1,240">long echo</button></div>
    <div class="ctl"><label for="sp">Subcarrier spacing × T<sub>u</sub></label><span class="val" id="sp-v"></span>
      <input type="range" id="sp" min="0.5" max="1.6" step="0.01" value="1"></div>
    <div class="ctl"><label for="tau">Echo delay τ</label><span class="val" id="tau-v"></span>
      <input type="range" id="tau" min="0" max="300" step="2" value="60"></div>
  </div>
  <div class="readouts">
    <div class="ro"><span class="k">spacing Δf</span><span class="v" id="o-df">—</span></div>
    <div class="ro"><span class="k">neighbors at a center</span><span class="v" id="o-ici">—</span></div>
    <div class="ro"><span class="k">echo path difference</span><span class="v" id="o-km">—</span></div>
    <div class="ro"><span class="k">echo vs. guard</span><span class="v" id="o-isi">—</span></div>
  </div>
</div>

<script>
'use strict';
// OFDM with the HD Radio numbers: useful symbol Tu = 1/363.4 Hz = 2.752 ms and a
// guard of 7/128 Tu = 150.5 us. Each subcarrier is a tone that lasts Tu, so its
// spectrum is sinc(f Tu); with spacing 1/Tu every other subcarrier's sinc
// crosses zero at each center, so they do not interfere.
const SANS = 'Inter, system-ui, -apple-system, sans-serif';
const C = { navy:'#004a85', mid:'#0067b9', red:'#b01e24', amber:'#8a5a00', rule:'#cddce9', ink:'#15202b', ink3:'#5b6573', grn:'#3f7d34', pale:'#eef4fa' };
const DF = 1488375 / 4096, TU = 1e6 / DF, TG = TU * 7 / 128;   // Hz, us, us
const spEl = document.getElementById('sp'), tauEl = document.getElementById('tau');
spEl.oninput = tauEl.oninput = () => { document.querySelectorAll('#preset button').forEach(b => b.classList.remove('on')); update(); };
document.querySelectorAll('#preset button').forEach(b => b.onclick = () => {
  const [s, t] = b.dataset.p.split(',').map(Number); spEl.value = s; tauEl.value = t;
  document.querySelectorAll('#preset button').forEach(x => x.classList.toggle('on', x === b)); update(); });

const sinc = x => Math.abs(x) < 1e-9 ? 1 : Math.sin(Math.PI * x) / (Math.PI * x);

function setup(cv, aspect, narrowH){
  const dpr = window.devicePixelRatio || 1, w = Math.max(200, cv.clientWidth || 300);
  const narrow = window.matchMedia && window.matchMedia('(max-width:620px)').matches;
  const h = narrow ? narrowH : Math.round(Math.min(w * aspect, 230));
  cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr); cv.style.height = h + 'px';
  const bh = cv.offsetHeight - cv.clientHeight; if (bh) cv.style.height = (h + bh) + 'px';
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); return { ctx, w, h };
}
function txt(ctx, s, x, y, px, col, align, bold){ ctx.fillStyle = col; ctx.font = (bold?'700 ':'') + px + 'px ' + SANS;
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y); }

function drawSpec(sp) {
  const cv = document.getElementById('spec'), { ctx, w, h } = setup(cv, 0.6, 165);
  ctx.clearRect(0, 0, w, h);
  const mL = 10, mR = 10, top = 26, y0 = h - 30, half = 4.6;
  const X = f => mL + (f + half) / (2 * half) * (w - mL - mR);
  const yz = top + (y0 - top) * 0.78, Y = a => yz - a * (yz - top);
  ctx.strokeStyle = C.rule; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(mL, yz); ctx.lineTo(w - mR, yz); ctx.stroke();
  const ks = [-2, -1, 0, 1, 2];
  for (const k of ks) {
    ctx.strokeStyle = k === 0 ? C.navy : C.mid; ctx.globalAlpha = k === 0 ? 1 : 0.45; ctx.lineWidth = k === 0 ? 2.2 : 1.4;
    ctx.beginPath();
    for (let i = 0; i <= 400; i++) { const f = -half + 2 * half * i / 400, a = sinc(f - k * sp);
      i ? ctx.lineTo(X(f), Y(a)) : ctx.moveTo(X(f), Y(a)); }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  for (const k of ks) { ctx.fillStyle = k === 0 ? C.navy : C.mid; ctx.beginPath(); ctx.arc(X(k * sp), Y(1), 3.2, 0, 2 * Math.PI); ctx.fill(); }
  // what the neighbors add at the center subcarrier's frequency
  ctx.strokeStyle = C.red; ctx.setLineDash([3, 3]); ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(X(0), top - 4); ctx.lineTo(X(0), y0); ctx.stroke(); ctx.setLineDash([]);
  for (const k of ks) if (k) { const a = sinc(-k * sp);
    ctx.fillStyle = C.red; ctx.beginPath(); ctx.arc(X(0), Y(a), 2.6, 0, 2 * Math.PI); ctx.fill(); }
  ctx.strokeStyle = C.ink3; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(mL, y0); ctx.lineTo(w - mR, y0); ctx.stroke();
  for (let f = -4; f <= 4; f++) { ctx.beginPath(); ctx.moveTo(X(f), y0); ctx.lineTo(X(f), y0 + 4); ctx.stroke();
    txt(ctx, String(f), X(f), y0 + 13, 10.5, C.ink3, 'center'); }
  txt(ctx, 'frequency × Tᵤ', w - mR, y0 + 24, 10.5, C.ink3, 'right');
  txt(ctx, 'five subcarriers', mL + 2, 11, 11, C.ink3, 'left', true);
}

function drawTime(tau) {
  const cv = document.getElementById('time'), { ctx, w, h } = setup(cv, 0.6, 165);
  ctx.clearRect(0, 0, w, h);
  const mL = 10, mR = 10, t0 = -TG - 40, t1 = 2 * (TU + TG) - TG + 320;
  const X = t => mL + (t - t0) / (t1 - t0) * (w - mL - mR);
  const rows = { d: 44, e: 92 }, bh = 26;
  // symbol n occupies [n(Tu+Tg) - Tg, n(Tu+Tg) + Tu]: guard, then the useful part
  function symbols(y, delay, col, label) {
    for (let n = 0; n < 2; n++) {
      const s = n * (TU + TG) + delay;
      ctx.fillStyle = C.amber; ctx.globalAlpha = 0.35; ctx.fillRect(X(s - TG), y, X(s) - X(s - TG), bh);
      ctx.fillStyle = col; ctx.globalAlpha = 0.55; ctx.fillRect(X(s), y, X(s + TU) - X(s), bh);
      ctx.globalAlpha = 1; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(X(s - TG), y, X(s + TU) - X(s - TG), bh);
      txt(ctx, 'symbol ' + (n + 1), (X(s) + X(s + TU)) / 2, y + bh / 2, 10.5, '#fff', 'center', true);
    }
    txt(ctx, label, mL + 2, y - 8, 10.5, C.ink3, 'left', true);
  }
  symbols(rows.d, 0, C.navy, 'direct path');
  symbols(rows.e, tau, C.mid, 'echo, τ later');
  // the receiver's FFT window for symbol 2 starts where the direct path's useful part starts
  const a = TU + TG, b = a + TU, yb = rows.e + bh + 10;
  ctx.strokeStyle = C.grn; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(X(a), rows.d - 4); ctx.lineTo(X(a), yb + 6); ctx.moveTo(X(b), rows.d - 4); ctx.lineTo(X(b), yb + 6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(X(a), yb); ctx.lineTo(X(b), yb); ctx.stroke();
  txt(ctx, 'FFT window for symbol 2', (X(a) + X(b)) / 2, yb + 12, 10.5, C.grn, 'center', true);
  // the echo of symbol 1 that reaches into that window
  const spill = tau - TG;
  if (spill > 0) { ctx.fillStyle = C.red; ctx.globalAlpha = 0.6;
    ctx.fillRect(X(a), rows.e, X(a + spill) - X(a), bh); ctx.globalAlpha = 1; }
  txt(ctx, 'guard', X(TU + TG / 2), rows.d + bh + 9, 10, C.amber, 'center', true);
}

function update() {
  const sp = +spEl.value, tau = +tauEl.value;
  document.getElementById('sp-v').textContent = sp.toFixed(2);
  document.getElementById('tau-v').textContent = tau.toFixed(0) + ' μs';
  document.getElementById('o-df').textContent = (sp * DF).toFixed(1) + ' Hz';
  // leakage from every other subcarrier: the sum of sinc^2(k sp) over k != 0,
  // which is 1/sp - 1 in closed form for sp <= 1
  let p = 0;
  if (sp <= 1) p = 1 / sp - 1;
  else for (let k = 1; k <= 20000; k++) p += 2 * sinc(k * sp) ** 2;
  const ici = document.getElementById('o-ici');
  if (p < 1e-12) { ici.textContent = 'none'; ici.className = 'v ok'; }
  else { ici.textContent = (10 * Math.log10(p)).toFixed(1) + ' dB'; ici.className = 'v bad'; }
  document.getElementById('o-km').textContent = (tau * 0.2998).toFixed(1) + ' km';
  const isi = document.getElementById('o-isi');
  // NRSC-5 tapers the symbol edges, so an echo late in the guard is marginal
  if (tau <= TG / 2) { isi.textContent = 'inside, ' + (TG - tau).toFixed(0) + ' μs spare'; isi.className = 'v ok'; }
  else if (tau <= TG) { isi.textContent = 'marginal, ' + (TG - tau).toFixed(0) + ' μs left'; isi.className = 'v warn'; }
  else { isi.textContent = (tau - TG).toFixed(0) + ' μs over'; isi.className = 'v bad'; }
  drawSpec(sp); drawTime(tau);
}

window.addEventListener('resize', update);
const q = new URLSearchParams(location.search);
if (q.get('sp')) spEl.value = q.get('sp');
if (q.get('tau')) tauEl.value = q.get('tau');
if (q.get('sp') || q.get('tau')) document.querySelectorAll('#preset button').forEach(b => b.classList.remove('on'));
update();
</script>
</body>
</html>
