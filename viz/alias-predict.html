<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Predict where the tone appears</title>
<style>
  :root { --navy:#004a85; --mid:#0067b9; --edge:#cddce9; --edge2:#b9d2e5; --bg:#f5f9fc;
          --ink:#15202b; --ink3:#5b6573; --amber:#8a5a00; --red:#b01e24; --band:#eaf2fa; }
  html,body { margin:0; padding:0; font-family:'Inter',system-ui,-apple-system,sans-serif; color:var(--ink); background:#fff; }
  .app { display:flex; flex-direction:column; gap:8px; padding:12px; }
  canvas { display:block; box-sizing:border-box; width:100%; height:auto; background:#fff; border:1px solid var(--edge); border-radius:6px; cursor:crosshair; }
  canvas:focus-visible { outline:2px solid var(--navy); outline-offset:2px; }
  .controls { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px 16px; align-items:end;
              padding:8px 12px; background:var(--bg); border:1px solid var(--edge); border-radius:6px; }
  @media (max-width:560px) { .controls { grid-template-columns:1fr; } }
  .ctl { display:grid; grid-template-columns:auto 1fr; column-gap:8px; row-gap:2px; align-items:center; min-width:0; }
  .ctl label, .ctl .lab { font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink3); font-weight:700; white-space:nowrap; }
  .ctl .val { color:var(--navy); font-size:12px; font-weight:600; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; }
  .ctl input[type=range] { grid-column:1 / span 2; width:100%; margin:0; accent-color:var(--mid); }
  .ctl.pred input[type=range] { accent-color:var(--amber); }
  .ctl.pred .val { color:var(--amber); }
  /* Before a guess the slider is faint, so its resting place does not suggest an answer. */
  .ctl.pred.open input[type=range] { opacity:0.35; }
  .seg { display:flex; gap:4px; justify-content:flex-end; flex-wrap:wrap; }
  .seg button { font:inherit; font-size:11.5px; font-weight:600; color:var(--navy); background:#fff; border:1px solid var(--edge2); border-radius:14px; padding:3px 10px; cursor:pointer; }
  .seg button[aria-pressed="true"] { background:var(--navy); color:#fff; border-color:var(--navy); }
  .show { font:700 12px 'Inter',system-ui,sans-serif; text-transform:uppercase; letter-spacing:0.05em;
          height:30px; padding:0 14px; border-radius:5px; cursor:pointer;
          border:1px solid var(--navy); background:var(--navy); color:#fff; }
  .show[aria-pressed="true"] { background:#fff; color:var(--navy); }
  .show:disabled { cursor:not-allowed; background:#e3e8ee; border-color:#c7cfd8; color:#7a8591; }
  .seg button:focus-visible, .show:focus-visible { outline:2px solid var(--navy); outline-offset:2px; }
  .readouts { display:grid; gap:6px; grid-template-columns:repeat(3,minmax(0,1fr)); }
  .ro { display:flex; flex-direction:column; align-items:center; gap:2px; padding:5px 4px 6px; min-width:0;
        border:1px solid var(--edge2); border-radius:6px; background:#eef4fa; }
  .ro .k { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink3); white-space:nowrap; overflow:hidden; max-width:100%; }
  .ro .v { font-size:14px; font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums; color:var(--navy); }
  .ro.p .v { color:var(--amber); }
  .ro.a .v { color:var(--red); }
</style>
</head>
<body>
<div class="app">
  <canvas id="plot" tabindex="0" aria-label="Top: the tone you set on a wide frequency axis, with the band the samples can show shaded. Bottom: the frequency sink, where you mark your prediction and, once you ask, where the spike appears."></canvas>

  <div class="controls">
    <div class="ctl"><span class="lab">Sample rate</span>
      <div class="seg" id="fs" role="group" aria-label="Sample rate">
        <button data-fs="32" aria-pressed="false">32 kHz</button><button data-fs="40" aria-pressed="true">40 kHz</button><button data-fs="64" aria-pressed="false">64 kHz</button>
      </div>
    </div>
    <div class="ctl"><label for="tone">Tone you set</label><span class="val" id="tone-v"></span>
      <input type="range" id="tone" min="-100" max="100" step="1" value="27"></div>
    <div class="ctl pred open" id="pred-ctl"><label for="pred">My prediction</label><span class="val" id="pred-v"></span>
      <input type="range" id="pred" min="-20" max="19" step="1" value="0"></div>
    <div class="ctl" style="justify-items:end"><span class="lab"></span>
      <button class="show" id="show" aria-pressed="false" disabled>Show where it appears</button></div>
  </div>

  <div class="readouts">
    <div class="ro"><span class="k">sink shows</span><span class="v" id="r-w">?</span></div>
    <div class="ro a"><span class="k">spike at</span><span class="v" id="r-a">?</span></div>
    <div class="ro p"><span class="k">my guess was</span><span class="v" id="r-o">?</span></div>
  </div>
</div>

<script>
'use strict';
// A complex tone at a set frequency, sampled at fs, and where the frequency
// sink shows it. Every frequency is in kHz. The sample rates offered are not
// the L5 Lab's 48 kHz, so no readout equals a Part 1 answer.
//
// Prediction first: the spike stays hidden until the cadet moves the
// prediction slider (or clicks the sink) and presses Show. Any change to the
// sample rate, the tone, or the prediction hides it again.
const SANS = 'Inter, system-ui, -apple-system, sans-serif';
const C = { navy:'#004a85', mid:'#0067b9', red:'#b01e24', amber:'#8a5a00', rule:'#cddce9',
            grid:'#e6eef6', axis:'#8a929c', ink:'#15202b', ink3:'#5b6573', band:'#eaf2fa' };
const WIDE = 100;                            // the top axis spans -100 to +100 kHz
const state = { fs: 40, tone: 27, pred: 0, committed: false, shown: false };

// The sink shows -fs/2 up to (not including) +fs/2: add or subtract fs until
// the tone lands there.
function alias(f, fs){ let a = ((f + fs/2) % fs + fs) % fs - fs/2; return Math.round(a*1000)/1000; }
const m = '−';
const fmt = v => (v < 0 ? m + Math.abs(v) : (v > 0 ? '+' + v : '0')) + ' kHz';

const canvas = document.getElementById('plot'), ctx = canvas.getContext('2d');
const toneEl = document.getElementById('tone'), predEl = document.getElementById('pred');
const showBtn = document.getElementById('show');

function stext(str,x,y,px,color,align,bold){ ctx.fillStyle=color; ctx.font=(bold?'700 ':'')+px+'px '+SANS; ctx.textAlign=align||'left'; ctx.textBaseline='middle'; ctx.fillText(str,x,y); }

let geo = null;
function resize(){
  const w = canvas.clientWidth, dpr = window.devicePixelRatio || 1;
  const h = Math.round(Math.max(250, Math.min(w*0.46, 320)));
  canvas.style.height = h + 'px';
  canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}
window.addEventListener('resize', resize);

function arrowHead(x, y, dir, color){
  ctx.fillStyle = color; ctx.beginPath();
  ctx.moveTo(x, y); ctx.lineTo(x - 6*dir, y - 4); ctx.lineTo(x - 6*dir, y + 4); ctx.closePath(); ctx.fill();
}

function draw(){
  const dpr = window.devicePixelRatio || 1, w = canvas.width/dpr, h = canvas.height/dpr;
  ctx.clearRect(0,0,w,h);
  const narrow = w < 470, fs = narrow ? 10 : 11.5, lab = narrow ? 11 : 12.5;
  const mL = 14, mR = 14, pw = w - mL - mR;
  const half = state.fs/2;

  // ---- top: the tone you set, on a wide axis ----
  const tTop = 24, tH = Math.round(h*0.30), tBase = tTop + tH;
  const xW = f => mL + (f + WIDE)/(2*WIDE)*pw;
  stext('Tone you set (kHz)', mL, 11, lab, C.ink, 'left', true);
  stext('shaded: the band the sink shows', w - mR, 11, fs, C.ink3, 'right');
  ctx.fillStyle = C.band; ctx.fillRect(xW(-half), tTop, xW(half) - xW(-half), tH);
  ctx.strokeStyle = C.axis; ctx.lineWidth = 1.1;
  ctx.beginPath(); ctx.moveTo(mL, tBase); ctx.lineTo(mL + pw, tBase); ctx.stroke();
  const step = narrow ? 50 : 25;
  for (let f = -WIDE; f <= WIDE; f += step){
    ctx.beginPath(); ctx.moveTo(xW(f), tBase); ctx.lineTo(xW(f), tBase + 4); ctx.stroke();
    stext(f === 0 ? '0' : (f < 0 ? m + (-f) : String(f)), xW(f), tBase + 13, fs, C.ink3, 'center');
  }
  // the tone itself
  ctx.strokeStyle = C.navy; ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.moveTo(xW(state.tone), tBase); ctx.lineTo(xW(state.tone), tTop + 6); ctx.stroke();
  ctx.fillStyle = C.navy; ctx.beginPath(); ctx.arc(xW(state.tone), tTop + 6, 3.5, 0, 2*Math.PI); ctx.fill();

  const a = alias(state.tone, state.fs);
  if (state.shown && a !== state.tone){
    // hops of fs from the tone into the band
    const n = Math.round((state.tone - a)/state.fs), dir = n > 0 ? -1 : 1;
    let f = state.tone, yy = tTop + tH*0.55;
    ctx.strokeStyle = C.red; ctx.lineWidth = 1.4; ctx.setLineDash([4,3]);
    for (let k = 0; k < Math.abs(n); k++){
      const g = f + dir*state.fs;
      ctx.beginPath(); ctx.moveTo(xW(f), yy); ctx.lineTo(xW(g), yy); ctx.stroke();
      ctx.setLineDash([]); arrowHead(xW(g), yy, dir, C.red); ctx.setLineDash([4,3]);
      f = g;
    }
    ctx.setLineDash([]);
    const lx = (xW(state.tone) + xW(a))/2;
    stext((dir < 0 ? m : '+') + Math.abs(n) + ' × ' + state.fs + ' kHz', lx, yy - 10, fs, C.red, 'center', true);
  }

  // ---- bottom: the frequency sink, -fs/2 to +fs/2 ----
  const sTop = tBase + 42, sBase = h - 30, sH = sBase - sTop;
  const xS = f => mL + (f + half)/(2*half)*pw;
  geo = { xS, sTop, sBase, mL, pw, half };
  stext('Frequency sink (kHz)', mL, sTop - 12, lab, C.ink, 'left', true);
  stext('click to mark your prediction', w - mR, sTop - 12, fs, C.ink3, 'right');
  ctx.fillStyle = '#fbfdff'; ctx.fillRect(mL, sTop, pw, sH);
  ctx.strokeStyle = C.grid; ctx.lineWidth = 1;
  const sStep = state.fs <= 40 ? 4 : 8;
  for (let f = -half; f <= half; f += sStep){ ctx.beginPath(); ctx.moveTo(xS(f), sTop); ctx.lineTo(xS(f), sBase); ctx.stroke(); }
  ctx.strokeStyle = C.axis; ctx.lineWidth = 1.1;
  ctx.beginPath(); ctx.moveTo(mL, sBase); ctx.lineTo(mL + pw, sBase); ctx.stroke();
  const lStep = narrow ? half/2 : sStep;
  for (let f = -half; f <= half; f += lStep){
    stext(f === 0 ? '0' : (f < 0 ? m + (-f) : String(f)), xS(f), sBase + 12, fs, C.ink3, 'center');
  }

  if (state.committed){
    ctx.strokeStyle = C.amber; ctx.lineWidth = 2; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(xS(state.pred), sBase); ctx.lineTo(xS(state.pred), sTop + 8); ctx.stroke();
    ctx.setLineDash([]);
    stext('my prediction', xS(state.pred), sTop + 2, fs, C.amber, xS(state.pred) > mL + pw - 60 ? 'right' : (xS(state.pred) < mL + 60 ? 'left' : 'center'), true);
  }
  if (state.shown){
    ctx.strokeStyle = C.red; ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.moveTo(xS(a), sBase); ctx.lineTo(xS(a), sTop + 22); ctx.stroke();
    stext('spike', xS(a), sTop + 15, fs, C.red, xS(a) > mL + pw - 40 ? 'right' : (xS(a) < mL + 40 ? 'left' : 'center'), true);
  } else if (!state.committed){
    const msg = 'Mark where the spike will appear', mpx = narrow ? 12 : 13.5;
    ctx.font = '700 ' + mpx + 'px ' + SANS;
    const mw = Math.min(ctx.measureText(msg).width + 20, pw - 8), my = sTop + sH*0.5;
    ctx.fillStyle = 'rgba(255,255,255,0.94)'; ctx.strokeStyle = '#b9d2e5'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(mL + pw/2 - mw/2, my - mpx, mw, 2*mpx, 5); ctx.fill(); ctx.stroke();
    stext(msg, mL + pw/2, my, mpx, C.navy, 'center', true);
  }
}

function sync(){
  const half = state.fs/2;
  predEl.min = -half; predEl.max = half - 1;
  predEl.value = state.pred;
  toneEl.value = state.tone;
  document.getElementById('tone-v').textContent = fmt(state.tone);
  document.getElementById('pred-v').textContent = state.committed ? fmt(state.pred) : '?';
  document.querySelectorAll('#fs button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.fs === state.fs ? 'true' : 'false'));
  showBtn.disabled = !state.committed;
  showBtn.setAttribute('aria-pressed', state.shown ? 'true' : 'false');
  showBtn.textContent = state.shown ? 'Hide it' : 'Show where it appears';
  document.getElementById('pred-ctl').classList.toggle('open', !state.committed);
  document.getElementById('r-w').textContent = m + half + ' to +' + half + ' kHz';
  const a = alias(state.tone, state.fs), off = Math.abs(state.pred - a);
  document.getElementById('r-a').textContent = state.shown ? fmt(a) : '?';
  document.getElementById('r-o').textContent = !state.shown ? '?' : (off === 0 ? 'right on' : 'off by ' + off + ' kHz');
  draw();
}

// Any change hides the answer. A new sample rate or tone also clears the
// prediction, so the next guess is made fresh.
function reset(){ state.committed = false; state.shown = false; state.pred = 0; }
document.querySelectorAll('#fs button').forEach(b => b.addEventListener('click', () => {
  state.fs = +b.dataset.fs; reset(); sync();
}));
toneEl.addEventListener('input', () => { state.tone = +toneEl.value; reset(); sync(); });
predEl.addEventListener('input', () => { state.pred = +predEl.value; state.committed = true; state.shown = false; sync(); });
showBtn.addEventListener('click', () => { if (state.committed){ state.shown = !state.shown; sync(); } });

function predictAt(clientX){
  if (!geo) return;
  const r = canvas.getBoundingClientRect(), x = clientX - r.left;
  let f = Math.round((x - geo.mL)/geo.pw*2*geo.half - geo.half);
  f = Math.max(-geo.half, Math.min(geo.half - 1, f));
  state.pred = f; state.committed = true; state.shown = false; sync();
}
canvas.addEventListener('click', e => {
  const r = canvas.getBoundingClientRect(), y = e.clientY - r.top;
  if (geo && y >= geo.sTop - 20) predictAt(e.clientX);
});
canvas.addEventListener('keydown', e => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  e.preventDefault();
  const half = state.fs/2, d = e.key === 'ArrowLeft' ? -1 : 1;
  state.pred = Math.max(-half, Math.min(half - 1, (state.committed ? state.pred : 0) + d));
  state.committed = true; state.shown = false; sync();
});

resize(); sync();
</script>
</body>
</html>
