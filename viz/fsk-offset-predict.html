<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Predict the FSK eye under a frequency offset</title>
<style>
  :root { --navy:#004a85; --mid:#0067b9; --edge:#cddce9; --edge2:#b9d2e5; --bg:#f5f9fc;
          --ink:#15202b; --ink3:#5b6573; --amber:#8a5a00; --red:#b01e24; --band:#eaf2fa; }
  html,body { margin:0; padding:0; font-family:'Inter',system-ui,-apple-system,sans-serif; color:var(--ink); background:#fff; }
  .app { display:flex; flex-direction:column; gap:8px; padding:12px; }
  canvas { display:block; box-sizing:border-box; width:100%; height:auto; background:#fff; border:1px solid var(--edge); border-radius:6px; }
  canvas:focus-visible { outline:2px solid var(--navy); outline-offset:2px; }
  .controls { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px 16px; align-items:end;
              padding:8px 12px; background:var(--bg); border:1px solid var(--edge); border-radius:6px; }
  @media (max-width:560px) { .controls { grid-template-columns:1fr; } }
  .ctl { display:grid; grid-template-columns:auto 1fr; column-gap:8px; row-gap:2px; align-items:center; min-width:0; }
  .ctl label, .ctl .lab { font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink3); font-weight:700; white-space:nowrap; }
  .ctl .val { color:var(--navy); font-size:12px; font-weight:600; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; }
  .ctl input[type=range] { grid-column:1 / span 2; width:100%; margin:0; accent-color:var(--mid); }
  .ctl.pred input[type=range] { accent-color:var(--amber); }
  .ctl.pred .val { color:var(--amber); }
  /* Before a guess the slider is faint, so its resting place does not suggest an answer. */
  .ctl.pred.open input[type=range] { opacity:0.35; }
  .seg { display:flex; gap:4px; justify-content:flex-end; flex-wrap:wrap; }
  .seg button { font:inherit; font-size:11.5px; font-weight:600; color:var(--navy); background:#fff; border:1px solid var(--edge2); border-radius:14px; padding:3px 10px; cursor:pointer; }
  .seg button[aria-pressed="true"] { background:var(--navy); color:#fff; border-color:var(--navy); }
  .show { font:700 12px 'Inter',system-ui,sans-serif; text-transform:uppercase; letter-spacing:0.05em;
          height:30px; padding:0 14px; border-radius:5px; cursor:pointer;
          border:1px solid var(--navy); background:var(--navy); color:#fff; }
  .show[aria-pressed="true"] { background:#fff; color:var(--navy); }
  .show:disabled { cursor:not-allowed; background:#e3e8ee; border-color:#c7cfd8; color:#7a8591; }
  .seg button:focus-visible, .show:focus-visible { outline:2px solid var(--navy); outline-offset:2px; }
  .readouts { display:grid; gap:6px; grid-template-columns:repeat(3,minmax(0,1fr)); }
  .ro { display:flex; flex-direction:column; align-items:center; gap:2px; padding:5px 4px 6px; min-width:0;
        border:1px solid var(--edge2); border-radius:6px; background:#eef4fa; }
  .ro .k { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink3); white-space:nowrap; overflow:hidden; max-width:100%; }
  .ro .v { font-size:14px; font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums; color:var(--navy); }
  .ro.p .v { color:var(--amber); }
  .ro.a .v { color:var(--red); }
</style>
</head>
<body>
<div class="app">
  <canvas id="plot" tabindex="0" aria-label="The eye diagram of an FSK demodulator output over two bits and, once you ask, the eye with a frequency offset, against the lower level you predicted."></canvas>

  <div class="controls">
    <div class="ctl"><span class="lab">Deviation</span>
      <div class="seg" id="dev" role="group" aria-label="Deviation">
        <button data-v="900" aria-pressed="false">900 Hz</button><button data-v="1250" aria-pressed="true">1250 Hz</button><button data-v="2500" aria-pressed="false">2500 Hz</button>
      </div>
    </div>
    <div class="ctl"><span class="lab">Offset</span>
      <div class="seg" id="off" role="group" aria-label="Frequency offset">
        <button data-v="250" aria-pressed="false">250 Hz</button><button data-v="350" aria-pressed="true">350 Hz</button><button data-v="450" aria-pressed="false">450 Hz</button>
      </div>
    </div>
    <div class="ctl pred open" id="pred-ctl"><label for="pred">My prediction: lower level</label><span class="val" id="pred-v"></span>
      <input type="range" id="pred" min="-1.5" max="1" step="0.01" value="-1"></div>
    <div class="ctl" style="justify-items:end"><span class="lab"></span>
      <button class="show" id="show" aria-pressed="false" disabled>Show the eye</button></div>
  </div>

  <div class="readouts">
    <div class="ro"><span class="k">no offset</span><span class="v">&minus;1.00</span></div>
    <div class="ro a"><span class="k">lower level</span><span class="v" id="r-a">?</span></div>
    <div class="ro p"><span class="k">my guess</span><span class="v" id="r-o">?</span></div>
  </div>
</div>

<script>
'use strict';
// An FSK link's demodulator output after a one-bit moving average, drawn as an
// eye over two bits. The Quadrature Demod's gain makes +dev a 1 and -dev a -1,
// so a frequency offset foff adds foff/dev to both levels: the lower level is
// -1 + foff/dev. The model leaves out the receive filter, so the offsets stay
// at or below half the deviation, where the real link still runs. The settings
// offered (900, 1250, 2500 Hz; 250, 350, 450 Hz) are not the lesson's worked 400
// Hz at 1000 Hz, and no combination reaches the L8 Lab's hidden offset, which is
// 1.2 to 1.6 times the recording's deviation.
//
// Prediction first: the eye stays hidden until the cadet moves the prediction
// slider and presses Show. Any change hides it again.
const SANS = 'Inter, system-ui, -apple-system, sans-serif';
const C = { navy:'#004a85', red:'#b01e24', amber:'#8a5a00', grid:'#e6eef6', axis:'#8a929c', ink:'#15202b', ink3:'#5b6573' };
const state = { dev: 1250, off: 350, pred: -1, committed: false, shown: false };
const lower = () => -1 + state.off/state.dev;
const m = '−', f2 = v => (v < -0.004 ? m : '') + Math.abs(v).toFixed(2);

// A fixed set of eye traces: every pattern of three bits, eight times over, each
// with its own small noise, from a seeded generator so the picture never jumps.
let seed = 448;
const rnd = () => { seed = (seed*1103515245 + 12345) % 2147483648; return seed/2147483648; };
const gauss = () => Math.sqrt(-2*Math.log(rnd() + 1e-12))*Math.cos(2*Math.PI*rnd());
const TRACES = [];
for (let r = 0; r < 8; r++) for (let p = 0; p < 8; p++){
  const b = [(p>>2)&1, (p>>1)&1, p&1].map(v => 2*v - 1);
  const n = Array.from({length: 41}, () => 0.05*gauss());
  TRACES.push({ b, n });
}

const canvas = document.getElementById('plot'), ctx = canvas.getContext('2d');
const predEl = document.getElementById('pred'), showBtn = document.getElementById('show');
function stext(s,x,y,px,color,align,bold){ ctx.fillStyle=color; ctx.font=(bold?'700 ':'')+px+'px '+SANS; ctx.textAlign=align||'left'; ctx.textBaseline='middle'; ctx.fillText(s,x,y); }

function resize(){
  const w = canvas.clientWidth, dpr = window.devicePixelRatio || 1;
  const h = Math.round(Math.max(w < 400 ? 200 : 230, Math.min(w*0.40, 290)));
  canvas.style.height = h + 'px';
  canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}
window.addEventListener('resize', resize);

function draw(){
  const dpr = window.devicePixelRatio || 1, w = canvas.width/dpr, h = canvas.height/dpr;
  ctx.clearRect(0,0,w,h);
  const narrow = w < 470, fs = narrow ? 10 : 11, lab = narrow ? 11 : 12.5;
  const mL = 34, mR = 10, pw = w - mL - mR, top = 28, bot = h - 22;
  const yv = v => (top + bot)/2 - v*(bot - top)/4.2;
  const xv = t => mL + t/2*pw;
  stext('Demodulator output, two bits wide', mL, 12, lab, C.ink, 'left', true);
  ctx.fillStyle = '#fbfdff'; ctx.fillRect(mL, top, pw, bot - top);
  [-2, -1, 0, 1, 2].forEach(v => {
    ctx.strokeStyle = v === 0 ? C.axis : C.grid; ctx.lineWidth = v === 0 ? 1.4 : 1;
    ctx.beginPath(); ctx.moveTo(mL, yv(v)); ctx.lineTo(mL + pw, yv(v)); ctx.stroke();
    stext(v === 0 ? '0' : (v < 0 ? m + Math.abs(v) : String(v)), mL - 4, yv(v), fs, C.ink3, 'right');
  });
  [0, 1, 2].forEach(t => {
    ctx.strokeStyle = C.grid; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(xv(t), top); ctx.lineTo(xv(t), bot); ctx.stroke();
  });
  stext('bit end', xv(1), bot + 11, fs, C.ink3, 'center');
  stext('slicer threshold', mL + pw - 4, yv(0) - 8, fs, C.ink3, 'right');
  // The levels with no offset, for reference.
  ctx.strokeStyle = C.navy; ctx.lineWidth = 1.4; ctx.setLineDash([4, 3]);
  [1, -1].forEach(v => { ctx.beginPath(); ctx.moveTo(mL, yv(v)); ctx.lineTo(mL + pw, yv(v)); ctx.stroke(); });
  ctx.setLineDash([]);
  if (state.committed){
    ctx.strokeStyle = C.amber; ctx.lineWidth = 2.2; ctx.setLineDash([6, 4]);
    ctx.beginPath(); ctx.moveTo(mL, yv(state.pred)); ctx.lineTo(mL + pw, yv(state.pred)); ctx.stroke();
    ctx.setLineDash([]);
  }
  if (state.shown){
    const s = state.off/state.dev;
    ctx.strokeStyle = 'rgba(176,30,36,0.35)'; ctx.lineWidth = 1.3;
    TRACES.forEach(tr => {
      ctx.beginPath();
      for (let i = 0; i <= 40; i++){
        const t = i/20, k = Math.min(1, Math.floor(t)), f = t - k;
        // The moving average ramps from one bit's level to the next across each bit.
        const v = tr.b[k] + (tr.b[k + 1] - tr.b[k])*f + s + tr.n[i];
        const X = xv(t), Y = yv(v);
        i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
      }
      ctx.stroke();
    });
  }
  if (!state.committed){
    const msg = 'Predict the lower level first', mpx = narrow ? 12 : 13.5;
    ctx.font = '700 ' + mpx + 'px ' + SANS;
    const mw = Math.min(ctx.measureText(msg).width + 20, pw - 8), my = (top + bot)/2;
    ctx.fillStyle = 'rgba(255,255,255,0.94)'; ctx.strokeStyle = '#b9d2e5'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(mL + pw/2 - mw/2, my - mpx, mw, 2*mpx, 5); ctx.fill(); ctx.stroke();
    stext(msg, mL + pw/2, my, mpx, C.navy, 'center', true);
  }
}

function sync(){
  predEl.value = state.pred;
  document.getElementById('pred-v').textContent = state.committed ? f2(state.pred) : '?';
  document.querySelectorAll('#dev button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.v === state.dev ? 'true' : 'false'));
  document.querySelectorAll('#off button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.v === state.off ? 'true' : 'false'));
  showBtn.disabled = !state.committed;
  showBtn.setAttribute('aria-pressed', state.shown ? 'true' : 'false');
  showBtn.textContent = state.shown ? 'Hide it' : 'Show the eye';
  document.getElementById('pred-ctl').classList.toggle('open', !state.committed);
  const d = Math.abs(state.pred - lower());
  document.getElementById('r-a').textContent = state.shown ? f2(lower()) : '?';
  document.getElementById('r-o').textContent = !state.shown ? '?' : (d < 0.03 ? 'right on' : 'off ' + d.toFixed(2));
  draw();
}

function reset(){ state.committed = false; state.shown = false; state.pred = -1; sync(); }
document.querySelectorAll('#dev button').forEach(b => b.addEventListener('click', () => { state.dev = +b.dataset.v; reset(); }));
document.querySelectorAll('#off button').forEach(b => b.addEventListener('click', () => { state.off = +b.dataset.v; reset(); }));
predEl.addEventListener('input', () => { state.pred = +predEl.value; state.committed = true; state.shown = false; sync(); });
showBtn.addEventListener('click', () => { if (state.committed){ state.shown = !state.shown; sync(); } });
canvas.addEventListener('keydown', e => {
  if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  e.preventDefault();
  const d = e.key === 'ArrowDown' ? -0.01 : 0.01;
  state.pred = Math.max(-1.5, Math.min(1, Math.round(((state.committed ? state.pred : -1) + d)*100)/100));
  state.committed = true; state.shown = false; sync();
});

resize(); sync();
</script>
</body>
</html>
